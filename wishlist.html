<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshMart - Wishlist</title>

    <link rel="stylesheet" href="wishlist.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>🛒 FreshMart</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="offers.html">Offers</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <!-- PAGE TITLE -->
    <section class="wishlist-title">

        <p>YOUR FAVOURITE PRODUCTS</p>

        <h2>♡ My Wishlist</h2>

        <span>Save your favourite products for later</span>

    </section>


    <!-- WISHLIST PRODUCTS -->
    <section class="wishlist-container" id="wishlistContainer">


        <!-- APPLES -->
        <div class="continue">

            <img src="apple.jpg" alt="Fresh Apples">

            <h3>Fresh Apples</h3>

            <p>₹180 / kg</p>

            <button>Add to Cart</button>

            <button class="remove-btn">
                Remove
            </button>

        </div>


        <!-- FRUITS -->
        <div class="continue">

            <img src="fruits.jpg" alt="Fresh Fruits">

            <h3>Fresh Fruits</h3>

            <p>₹150 / kg</p>

            <button>Add to Cart</button>

            <button class="remove-btn">
                Remove
            </button>

        </div>


        <!-- VEGETABLES -->
        <div class="continue">

            <img src="vegetables.jpg" alt="Fresh Vegetables">

            <h3>Fresh Vegetables</h3>

            <p>₹80 / kg</p>

            <button>Add to Cart</button>

            <button class="remove-btn">
                Remove
            </button>

        </div>

    </section>


    <!-- CONTINUE SHOPPING -->
    <div class="continue">

        <a href="shop.html">
            ← Continue Shopping
        </a>

    </div>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 FreshMart. All Rights Reserved.
        </p>

    </footer>
    <script src="script.js"></script>

</body>

</html>
