<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshMart Admin Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
            color: #198754;
        }

        .login-box p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;

            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 6px;

            background: #198754;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }

        #message {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🛒 FreshMart</h1>

        <p>Admin Login</p>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="adminLogin()">
            Login
        </button>

        <div id="message"></div>

    </div>

    <script>

        function adminLogin() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value.trim();

            if (username === "admin" && password === "1234") {

                localStorage.setItem("adminLoggedIn", "true");

                window.location.href = "admin.html";

            } else {

                document.getElementById("message").innerText =
                    "Invalid username or password!";

            }
        }

    </script>

</body>

</html>
